<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">

<defs>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1677FF" stroke-width="1" opacity=".06"/>
  </pattern>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".11"/>
  </filter>

  <filter id="blur">
    <feGaussianBlur stdDeviation="10"/>
  </filter>

  <linearGradient id="scan">
    <stop offset="0" stop-color="#1677FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#1677FF" stop-opacity=".65"/>
    <stop offset="1" stop-color="#1677FF" stop-opacity="0"/>
  </linearGradient>

  <clipPath id="clip">
    <rect x="690" y="65" width="825" height="470" rx="22"/>
  </clipPath>

</defs>

<!-- BACKGROUND -->
<rect width="1600" height="600" fill="#FFFFFF"/>

<!-- MOVING GRID -->
<rect width="1600" height="600" fill="url(#grid)">
  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;40 40;0 0"
    dur="7s"
    repeatCount="indefinite"/>
</rect>

<!-- BACKGROUND PULSE -->
<circle cx="1240" cy="300" r="180"
        fill="#1677FF"
        opacity=".025"
        filter="url(#blur)">
  <animate attributeName="r"
           values="180;250;180"
           dur="4s"
           repeatCount="indefinite"/>
  <animate attributeName="opacity"
           values=".02;.07;.02"
           dur="4s"
           repeatCount="indefinite"/>
</circle>

<!-- LEFT ACCENT -->
<rect x="88" y="105" width="5" height="275" rx="3" fill="#1677FF">
  <animate attributeName="height"
           values="275;330;275"
           dur="2.5s"
           repeatCount="indefinite"/>
</rect>

<!-- TITLE -->
<text x="120" y="135"
      font-family="Arial,sans-serif"
      font-size="18"
      font-weight="700"
      letter-spacing="4"
      fill="#1677FF">
  EXCEL
</text>

<text x="120" y="170"
      font-family="Arial,sans-serif"
      font-size="13"
      font-weight="600"
      letter-spacing="3"
      fill="#111111">
  TASK
</text>

<text x="120" y="235"
      font-family="Arial,sans-serif"
      font-size="47"
      font-weight="700"
      fill="#111111">
  Excel Data
</text>

<text x="120" y="285"
      font-family="Arial,sans-serif"
      font-size="47"
      font-weight="700"
      fill="#1677FF">
  Analysis
</text>

<rect x="120" y="320" width="270" height="2" fill="#111111"/>

<text x="120" y="355"
      font-family="Arial,sans-serif"
      font-size="14"
      letter-spacing="2"
      fill="#667085">
  CELLS
</text>

<circle cx="178" cy="350" r="3" fill="#1677FF">
  <animate attributeName="r"
           values="3;7;3"
           dur="1.3s"
           repeatCount="indefinite"/>
</circle>

<text x="193" y="355"
      font-family="Arial,sans-serif"
      font-size="14"
      letter-spacing="2"
      fill="#667085">
  FORMULAS
</text>

<circle cx="300" cy="350" r="3" fill="#1677FF">
  <animate attributeName="r"
           values="3;7;3"
           dur="1.3s"
           repeatCount="indefinite"/>
</circle>

<text x="315" y="355"
      font-family="Arial,sans-serif"
      font-size="14"
      letter-spacing="2"
      fill="#667085">
  INSIGHTS
</text>

<!-- LEFT DECORATION -->
<g opacity=".4">

  <path d="M120 410H390"
        stroke="#111111"
        stroke-width="1"/>

  <path d="M120 425H340"
