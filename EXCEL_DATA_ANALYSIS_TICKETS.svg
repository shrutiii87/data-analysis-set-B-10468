  </text>

  <!-- ACTIVE -->
  <circle cx="1450" cy="94"
          r="5"
          fill="#1677FF">
    <animate attributeName="r"
             values="4;9;4"
             dur="1.2s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;.25;1"
             dur="1.2s"
