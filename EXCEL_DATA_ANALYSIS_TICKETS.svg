    <text x="980" y="237">C</text>
    <text x="1110" y="237">D</text>
    <text x="1240" y="237">E</text>
    <text x="1370" y="237">F</text>
    <text x="1450" y="237">G</text>

  </g>

  <!-- GRID -->
  <g stroke="#E5E7EB" stroke-width="1">

    <path d="M720 249H1480"/>
    <path d="M720 284H1480"/>
    <path d="M720 319H1480"/>
    <path d="M720 354H1480"/>
    <path d="M720 389H1480"/>
    <path d="M720 424H1480"/>
    <path d="M720 459H1480"/>

    <path d="M820 215V475"/>
    <path d="M950 215V475"/>
    <path d="M1080 215V475"/>
    <path d="M1210 215V475"/>
    <path d="M1340 215V475"/>
    <path d="M1420 215V475"/>

  </g>

  <!-- DATA -->
  <g font-family="monospace" font-size="11" fill="#111111">
    <text x="738" y="273" fill="#111111">1</text>
    <text x="838" y="273" fill="#111111">Jan</text>
    <text x="968" y="273" fill="#111111">T1</text>
    <text x="1098" y="273" fill="#111111">Email</text>
    <text x="1228" y="273" fill="#111111">12</text>
    <text x="1358" y="273" fill="#111111">4</text>
    <text x="738" y="308" fill="#111111">2</text>
    <text x="838" y="308" fill="#111111">Jan</text>
    <text x="968" y="308" fill="#111111">T2</text>
    <text x="1098" y="308" fill="#111111">Chat</text>
    <text x="1228" y="308" fill="#111111">28</text>
    <text x="1358" y="308" fill="#111111">3</text>
    <text x="738" y="343" fill="#111111">3</text>
    <text x="838" y="343" fill="#111111">Jan</text>
    <text x="968" y="343" fill="#111111">T3</text>
    <text x="1098" y="343" fill="#111111">Phone</text>
    <text x="1228" y="343" fill="#111111">36</text>
    <text x="1358" y="343" fill="#111111">2</text>
    <text x="738" y="378" fill="#111111">4</text>
    <text x="838" y="378" fill="#111111">Jan</text>
    <text x="968" y="378" fill="#111111">T4</text>
    <text x="1098" y="378" fill="#111111">Email</text>
    <text x="1228" y="378" fill="#111111">20</text>
    <text x="1358" y="378" fill="#111111">4</text>
    <text x="738" y="413" fill="#111111">5</text>
    <text x="838" y="413" fill="#111111">Feb</text>
    <text x="968" y="413" fill="#111111">T1</text>
    <text x="1098" y="413" fill="#111111">Chat</text>
    <text x="1228" y="413" fill="#111111">8</text>
    <text x="1358" y="413" fill="#111111">5</text>
    <text x="738" y="448" fill="#111111">6</text>
    <text x="838" y="448" fill="#111111">Feb</text>
    <text x="968" y="448" fill="#111111">T2</text>
    <text x="1098" y="448" fill="#111111">Phone</text>
    <text x="1228" y="448" fill="#111111">30</text>
    <text x="1358" y="448" fill="#111111">3</text>

  </g>

  <!-- MOVING CELL HIGHLIGHT -->
  <rect x="821" y="250"
        width="128"
        height="34"
        fill="#1677FF"
        opacity=".08">

    <animate attributeName="x"
             values="821;951;1081;1211;1341;821"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>

  <!-- SELECTION BORDER -->
  <rect x="821" y="250"
        width="128"
        height="34"
        fill="none"
        stroke="#1677FF"
        stroke-width="2">

    <animate attributeName="x"
             values="821;951;1081;1211;1341;821"
             dur="4s"
             repeatCount="indefinite"/>

  </rect>

</g>

<!-- SCANNING LINE -->
<rect x="700" y="65"
      width="3"
      height="470"
      fill="url(#scan)"
      opacity=".65">

  <animate attributeName="x"
           values="700;1505;700"
           dur="5s"
           repeatCount="indefinite"/>

</rect>

<!-- ORBIT -->
<ellipse cx="1100"
         cy="300"
         rx="480"
         ry="275"
         fill="none"
         stroke="#1677FF"
         stroke-width="1"
         stroke-dasharray="3 12"
         opacity=".12">

  <animateTransform
    attributeName="transform"
    type="rotate"
    values="0 1100 300;360 1100 300"
    dur="16s"
    repeatCount="indefinite"/>

</ellipse>

<!-- FLOATING PARTICLES -->
<g fill="#1677FF">

  <circle cx="1400" cy="535" r="4">
    <animate attributeName="cy"
             values="535;500;535"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1460" cy="545" r="3">
