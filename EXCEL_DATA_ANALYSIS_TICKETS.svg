  <circle cx="1345" cy="530" r="3">
    <animate attributeName="cy"
             values="530;495;530"
             dur="2.3s"
             repeatCount="indefinite"/>
  </circle>

</g>

<!-- PULSE NODE -->
<circle cx="1510" cy="535" r="6" fill="#1677FF">

  <animate attributeName="cy"
           values="535;505;535"
           dur="2.2s"
           repeatCount="indefinite"/>

</circle>

<circle cx="1510" cy="535"
        r="12"
        fill="none"
        stroke="#1677FF"
        opacity=".35">

  <animate attributeName="r"
           values="10;32;10"
           dur="2.2s"
           repeatCount="indefinite"/>

  <animate attributeName="opacity"
           values=".5;0;.5"
           dur="2.2s"
           repeatCount="indefinite"/>

</circle>

<!-- BOTTOM MOVING ACCENT -->
<rect x="120" y="505"
      width="420"
      height="2"
      fill="#E5E7EB"/>

<rect x="120" y="505"
      width="80"
      height="2"
      fill="#1677FF">

  <animate attributeName="width"
           values="80;300;80"
           dur="2.5s"
           repeatCount="indefinite"/>

</rect>

</svg>
