  <text x="15" y="17"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        fill="#1677FF">
    EXCEL
  </text>

  <!-- CELLS -->
  <g stroke="#DDE2E8" stroke-width="1">

    <path d="M10 38H180"/>
    <path d="M10 58H180"/>
    <path d="M10 78H180"/>
    <path d="M10 98H180"/>

    <path d="M55 28V105"/>
    <path d="M105 28V105"/>
    <path d="M145 28V105"/>

  </g>

  <!-- MOVING CELL -->
  <rect x="56" y="39"
        width="48"
        height="19"
        fill="#1677FF"
        opacity=".15">
    <animate attributeName="x"
             values="56;106;146;56"
             dur="3s"
             repeatCount="indefinite"/>
    <animate attributeName="y"
             values="39;59;79;39"
             dur="3s"
             repeatCount="indefinite"/>
  </rect>

  <text x="18" y="52"
        font-family="monospace"
        font-size="9"
        fill="#111111">
    A1
  </text>

  <text x="66" y="52"
        font-family="monospace"
        font-size="9"
        fill="#1677FF">
    82
  </text>

  <text x="116" y="52"
        font-family="monospace"
        font-size="9"
        fill="#111111">
    94
  </text>

</g>

<!-- MAIN WORKSPACE -->
<rect x="690" y="65"
      width="825"
      height="470"
      rx="22"
      fill="#FFFFFF"
      filter="url(#shadow)"/>

<rect x="690" y="65"
      width="825"
      height="470"
      rx="22"
      fill="#FFFFFF"
      stroke="#111111"
      stroke-width="1.2"/>

<g clip-path="url(#clip)">

  <!-- HEADER -->
  <rect x="690" y="65"
        width="825"
        height="70"
        fill="#FAFAFA"/>

  <text x="725" y="105"
        font-family="Arial,sans-serif"
        font-size="19"
        font-weight="700"
