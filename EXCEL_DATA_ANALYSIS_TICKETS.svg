  <circle cx="120" cy="410" r="3" fill="#1677FF">
    <animate attributeName="cx"
             values="120;390;120"
             dur="2.8s"
             repeatCount="indefinite"/>
  </circle>

</g>

<!-- FLOATING EXCEL SHEET -->
<g transform="translate(390 380)">

  <rect x="0" y="0"
        width="190"
        height="115"
        rx="10"
        fill="#FFFFFF"
        stroke="#111111"
        stroke-width="1.3"/>

  <!-- HEADER -->
