<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">

<defs>

  <pattern id="microGrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#EEF2F7" stroke-width="1"></path>
  </pattern>

  <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1677FF"></stop>
    <stop offset="100%" stop-color="#69A7FF"></stop>
  </linearGradient>

  <radialGradient id="ambient">
    <stop offset="0%" stop-color="#1677FF" stop-opacity=".12"></stop>
    <stop offset="100%" stop-color="#1677FF" stop-opacity="0"></stop>
  </radialGradient>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="1600" height="600" fill="#FFFFFF"></rect>

<rect width="1600" height="600" fill="url(#microGrid)">
  <animateTransform attributeName="transform" type="translate" values="0 0;40 40;0 0" dur="18s" repeatCount="indefinite"></animateTransform>
</rect>

<circle cx="1210" cy="300" r="330" fill="url(#ambient)">
  <animate attributeName="r" values="300;350;300" dur="9s" repeatCount="indefinite"></animate>
</circle>


<!-- ===================================================== -->
<!-- LEFT TYPOGRAPHY -->
<!-- ===================================================== -->

<text x="105" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#1677FF">
  PROJECT 01
</text>

<text x="105" y="220" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#111111">
  CUSTOMER SUPPORT
</text>

<text x="105" y="290" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#111111">
  QUALITY
</text>

<text x="105" y="360" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#1677FF">
  ANALYSIS
</text>

<!-- thin animated underline -->
<rect x="108" y="390" width="360" height="2" fill="#DCE5F2"></rect>

<rect x="108" y="390" width="90" height="2" fill="#1677FF">

  <animate attributeName="x" values="108;378;108" dur="4s" repeatCount="indefinite"></animate>

</rect>

<text x="108" y="425" font-family="Arial" font-size="15" letter-spacing="1.4" fill="#667085">
  DATA • PATTERNS • PERFORMANCE • INSIGHTS
</text>


<!-- ===================================================== -->
<!-- FOUR TOOLS — HORIZONTAL DATA PIPELINE -->
<!-- ===================================================== -->

<g transform="translate(105 465)">

  <!-- connecting line -->
  <line x1="30" y1="18" x2="510" y2="18" stroke="#DCE5F2" stroke-width="2"></line>

  <line x1="30" y1="18" x2="510" y2="18" stroke="#1677FF" stroke-width="2" stroke-dasharray="8 18">

    <animate attributeName="stroke-dashoffset" values="0;-52" dur="2s" repeatCount="indefinite"></animate>

  </line>


  <!-- PYTHON -->
  <g transform="translate(0 0)">

    <circle cx="30" cy="18" r="18" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <circle cx="30" cy="18" r="6" fill="#1677FF">

      <animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"></animate>

    </circle>

    <text x="30" y="52" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#111111">
      PYTHON
    </text>

  </g>


  <!-- EXCEL -->
  <g transform="translate(160 0)">

    <circle cx="30" cy="18" r="18" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <rect x="23" y="11" width="14" height="14" fill="none" stroke="#1677FF" stroke-width="1.5"></rect>

    <line x1="23" y1="16" x2="37" y2="16" stroke="#1677FF"></line>

    <line x1="30" y1="11" x2="30" y2="25" stroke="#1677FF"></line>

    <text x="30" y="52" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#111111">
      EXCEL
    </text>

  </g>


  <!-- POWER BI -->
  <g transform="translate(320 0)">

    <circle cx="30" cy="18" r="18" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <rect x="21" y="18" width="4" height="9" rx="1" fill="#1677FF">
      <animate attributeName="height" values="6;12;9;6" dur="2.2s" repeatCount="indefinite"></animate>
      <animate attributeName="y" values="21;15;18;21" dur="2.2s" repeatCount="indefinite"></animate>
    </rect>

    <rect x="28" y="14" width="4" height="13" rx="1" fill="#1677FF">
      <animate attributeName="height" values="9;15;13;9" dur="2.5s" repeatCount="indefinite"></animate>
      <animate attributeName="y" values="18;12;14;18" dur="2.5s" repeatCount="indefinite"></animate>
    </rect>

    <rect x="35" y="10" width="4" height="17" rx="1" fill="#1677FF">
      <animate attributeName="height" values="12;19;17;12" dur="2.7s" repeatCount="indefinite"></animate>
      <animate attributeName="y" values="15;8;10;15" dur="2.7s" repeatCount="indefinite"></animate>
    </rect>

    <text x="30" y="52" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#111111">
      POWER BI
    </text>

  </g>


  <!-- SQL -->
  <g transform="translate(480 0)">

    <circle cx="30" cy="18" r="18" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <text x="30" y="22" text-anchor="middle" font-family="Courier New" font-size="9" font-weight="700" fill="#1677FF">
      SQL
    </text>

    <rect x="45" y="11" width="2" height="14" fill="#1677FF">

      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"></animate>

    </rect>

    <text x="30" y="52" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#111111">
      SQL
    </text>

  </g>

</g>


<!-- ===================================================== -->
<!-- RIGHT: ABSTRACT ANALYTICS COMPOSITION -->
<!-- ===================================================== -->

<g transform="translate(735 90)">

  <!-- LARGE CIRCLE -->
  <circle cx="365" cy="215" r="175" fill="none" stroke="#E3EAF3" stroke-width="1.5"></circle>

  <circle cx="365" cy="215" r="175" fill="none" stroke="#1677FF" stroke-width="1.5" stroke-dasharray="5 15" opacity=".45">

    <animateTransform attributeName="transform" type="rotate" from="0 365 215" to="360 365 215" dur="20s" repeatCount="indefinite"></animateTransform>

  </circle>


  <!-- INNER ORBIT -->
  <ellipse cx="365" cy="215" rx="125" ry="75" fill="none" stroke="#DDE6F2" stroke-width="1"></ellipse>

  <ellipse cx="365" cy="215" rx="125" ry="75" fill="none" stroke="#1677FF" stroke-width="1.5" stroke-dasharray="6 12" opacity=".4">

    <animateTransform attributeName="transform" type="rotate" from="360 365 215" to="0 365 215" dur="12s" repeatCount="indefinite"></animateTransform>

  </ellipse>


  <!-- CENTER -->
  <circle cx="365" cy="215" r="62" fill="#111111"></circle>

  <circle cx="365" cy="215" r="48" fill="#1677FF" opacity=".12">

    <animate attributeName="r" values="42;55;42" dur="4s" repeatCount="indefinite"></animate>

  </circle>

  <text x="365" y="208" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" letter-spacing="2" fill="#FFFFFF">
    INSIGHTS
  </text>

  <text x="365" y="230" text-anchor="middle" font-family="Arial" font-size="10" letter-spacing="1" fill="#8EBBFF">
    FROM DATA
  </text>


  <!-- PYTHON NODE -->
  <g transform="translate(355 28)">

    <circle cx="10" cy="10" r="29" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <text x="10" y="14" text-anchor="middle" font-family="Arial" font-size="8" font-weight="800" fill="#111111">
      PYTHON
    </text>

    <circle cx="10" cy="10" r="34" fill="none" stroke="#1677FF" stroke-width="1" stroke-dasharray="3 7" opacity=".4">

      <animateTransform attributeName="transform" type="rotate" from="0 10 10" to="360 10 10" dur="5s" repeatCount="indefinite"></animateTransform>

    </circle>

  </g>


  <!-- EXCEL NODE -->
  <g transform="translate(175 190)">

    <circle cx="10" cy="10" r="29" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <text x="10" y="14" text-anchor="middle" font-family="Arial" font-size="9" font-weight="800" fill="#111111">
      EXCEL
    </text>

  </g>


  <!-- POWER BI NODE -->
  <g transform="translate(525 190)">

    <circle cx="10" cy="10" r="29" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <text x="10" y="14" text-anchor="middle" font-family="Arial" font-size="8" font-weight="800" fill="#111111">
      POWER BI
    </text>

  </g>


  <!-- SQL NODE -->
  <g transform="translate(355 370)">

    <circle cx="10" cy="10" r="29" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"></circle>

    <text x="10" y="14" text-anchor="middle" font-family="Arial" font-size="9" font-weight="800" fill="#111111">
      SQL
    </text>

  </g>


  <!-- CONNECTIONS -->
  <g stroke="#D9E3EF" stroke-width="2">

    <line x1="365" y1="70" x2="365" y2="153"></line>
    <line x1="214" y1="200" x2="303" y2="215"></line>
    <line x1="536" y1="200" x2="427" y2="215"></line>
    <line x1="365" y1="380" x2="365" y2="277"></line>

  </g>


  <!-- MOVING CONNECTION DOT -->
  <circle cx="365" cy="70" r="4" fill="#1677FF">

    <animate attributeName="cy" values="70;153;70" dur="3s" repeatCount="indefinite"></animate>

  </circle>

  <circle cx="214" cy="200" r="4" fill="#1677FF">

    <animate attributeName="cx" values="214;303;214" dur="3s" repeatCount="indefinite"></animate>

  </circle>

  <circle cx="536" cy="200" r="4" fill="#1677FF">

    <animate attributeName="cx" values="536;427;536" dur="3s" repeatCount="indefinite"></animate>

  </circle>

  <circle cx="365" cy="380" r="4" fill="#1677FF">

    <animate attributeName="cy" values="380;277;380" dur="3s" repeatCount="indefinite"></animate>

  </circle>


  <!-- SMALL FLOATING DATA POINTS -->
  <circle cx="105" cy="100" r="3" fill="#1677FF">
    <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"></animate>
  </circle>

  <circle cx="620" cy="95" r="3" fill="#1677FF">
    <animate attributeName="cy" values="95;75;95" dur="3s" repeatCount="indefinite"></animate>
  </circle>

  <circle cx="650" cy="400" r="4" fill="#1677FF">
    <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"></animate>
  </circle>

</g>


<!-- ===================================================== -->
<!-- CLEAN BOTTOM ACCENT -->
<!-- ===================================================== -->

<line x1="735" y1="540" x2="1470" y2="540" stroke="#E5EAF1" stroke-width="2"></line>

<line x1="735" y1="540" x2="850" y2="540" stroke="#1677FF" stroke-width="2">

  <animate attributeName="x1" values="735;1350;735" dur="5s" repeatCount="indefinite"></animate>

  <animate attributeName="x2" values="850;1465;850" dur="5s" repeatCount="indefinite"></animate>

</line>

</svg>
