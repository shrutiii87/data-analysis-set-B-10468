<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">

<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1677FF" stroke-width="1" opacity=".06"/>
  </pattern>

  <filter id="shadow">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".10"/>
  </filter>

  <clipPath id="clip">
    <rect x="690" y="65" width="825" height="470" rx="22"/>
  </clipPath>
</defs>

<!-- WHITE BACKGROUND -->
<rect width="1600" height="600" fill="#fff"/>

<!-- ANIMATED BACKGROUND GRID -->
<rect width="1600" height="600" fill="url(#grid)">
  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0;40 40;0 0"
    dur="8s"
    repeatCount="indefinite"/>
</rect>

<!-- ANIMATED BACKGROUND GLOW -->
<circle cx="1250" cy="300" r="180" fill="#1677FF" opacity=".025">
  <animate attributeName="r" values="180;240;180" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".02;.055;.02" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- LEFT BLUE LINE -->
<rect x="88" y="105" width="5" height="275" rx="3" fill="#1677FF">
  <animate attributeName="height" values="275;330;275" dur="3s" repeatCount="indefinite"/>
</rect>

<!-- LEFT TEXT -->
<text x="120" y="135" font-family="Arial,sans-serif" font-size="18"
      font-weight="700" letter-spacing="4" fill="#1677FF">POWER BI</text>

<text x="120" y="170" font-family="Arial,sans-serif" font-size="13"
      font-weight="600" letter-spacing="3" fill="#111">TASK</text>

<text x="120" y="235" font-family="Arial,sans-serif" font-size="47"
      font-weight="700" fill="#111">Power BI</text>

<text x="120" y="285" font-family="Arial,sans-serif" font-size="47"
      font-weight="700" fill="#1677FF">Analysis</text>

<rect x="120" y="320" width="270" height="2" fill="#111"/>

<text x="120" y="355" font-family="Arial,sans-serif" font-size="14"
      letter-spacing="2" fill="#667085">DATA</text>

<circle cx="177" cy="350" r="3" fill="#1677FF">
  <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
</circle>

<text x="190" y="355" font-family="Arial,sans-serif" font-size="14"
      letter-spacing="2" fill="#667085">PERFORMANCE</text>

<circle cx="340" cy="350" r="3" fill="#1677FF">
  <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
</circle>

<text x="353" y="355" font-family="Arial,sans-serif" font-size="14"
      letter-spacing="2" fill="#667085">INSIGHTS</text>

<!-- ANIMATED DATA LINES -->
<g opacity=".35">
  <path d="M120 410H390" stroke="#111"/>
  <path d="M120 425H330" stroke="#1677FF"/>
  <path d="M120 440H370" stroke="#111"/>

  <circle cx="120" cy="410" r="3" fill="#1677FF">
    <animate attributeName="cx"
      values="120;390;120"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>
</g>

<!-- DASHBOARD -->
<rect x="690" y="65" width="825" height="470"
      rx="22" fill="#fff" filter="url(#shadow)"/>

<rect x="690" y="65" width="825" height="470"
      rx="22" fill="#fff" stroke="#111" stroke-width="1.2"/>

<g clip-path="url(#clip)">

<!-- HEADER -->
<rect x="690" y="65" width="825" height="70" fill="#FAFAFA"/>

<text x="725" y="105" font-family="Arial,sans-serif"
